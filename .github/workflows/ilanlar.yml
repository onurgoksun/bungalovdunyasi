# Üyelerin eklediği tesisleri düzenli aralıklarla statik sayfalara dönüştürür (arama motorları için).
# Tesis sayfası eklendiği anda /tesis/?t=... adresinde zaten yayındadır; bu iş yalnızca kalıcı sayfaları üretir.
name: Tesis sayfalarını güncelle

on:
  schedule:
    - cron: "17 * * * *"   # saatte bir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Siteyi üret
        run: python3 build.py
      - name: Değişiklik varsa yayınla
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "Bungalov Dünyası"
          git config user.email "onurgethagoksun@gmail.com"
          git add -A content/ilanlar.json docs
          git commit -m "Tesis sayfaları güncellendi"
          git pull --rebase -X theirs origin main || { git rebase --abort; git reset --hard origin/main; python3 build.py; git add -A content/ilanlar.json docs; git commit -m "Tesis sayfaları güncellendi"; }
          git push origin HEAD:main
