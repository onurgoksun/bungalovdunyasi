# Siteye yeni yazı ya da değişiklik gönderildiğinde değişen sayfaları Bing ve Yandex'e hemen bildirir.
name: Arama motorlarına bildir

on:
  push:
    branches: [main]
    paths: ["docs/**"]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Yayının bitmesini bekle
        run: sleep 90
      - name: IndexNow
        run: python3 tools/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
